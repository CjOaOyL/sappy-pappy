[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/**"]

# Keep admin page out of search engines
[[headers]]
  for = "/bluebear/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/finance.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# Security headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Redirect /bluebear/book to the book page cleanly
[[redirects]]
  from = "/book"
  to = "/bluebear/book.html"
  status = 301

# Netlify Forms spam filtering
[build.processing]
  skip_processing = false

# Paste into C:\Users\jaqua\sappy-pappy\netlify.toml at cutover (Phase 4).
# Old Green Book URLs -> JaquansList. 301s keep query strings, so owner edit links
# (?edit=TOKEN), admin links (?admin=1) and deep links (?biz=ID) all keep working.

[[redirects]]
  from = "/green-book.html"
  to = "https://jaquanslist.com/"
  status = 301
  force = true

[[redirects]]
  from = "/green-book-apply.html"
  to = "https://jaquanslist.com/list-your-business.html"
  status = 301
  force = true
